[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stageverse-pipeline"
version = "0.1.0"
description = "StageVerse cloud GPU pipeline and show package tools"
requires-python = ">=3.11"
dependencies = ["jsonschema[format-nongpl]>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["stageverse_schema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
